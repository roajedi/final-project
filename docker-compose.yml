services:
  app:
    build: .
    ports:
      - "8080:8080"

    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://postgres:postgres@db:5432/logsdb"

      AUTH_ENABLED: "${AUTH_ENABLED:-false}"
      LOADGEN_API_KEY: "${LOADGEN_API_KEY:-}"

      RETENTION_DAYS: "${RETENTION_DAYS:-30}"
      RETENTION_INTERVAL_MS: "${RETENTION_INTERVAL_MS:-60000}"
      RETENTION_BATCH_SIZE: "${RETENTION_BATCH_SIZE:-5000}"

      DB_POOL_MAX: "${DB_POOL_MAX:-50}" 

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8080/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  db:
    image: postgres:16-alpine

    command: >
      postgres
      -c synchronous_commit=off
      -c max_connections=300
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c work_mem=16MB
      -c maintenance_work_mem=64MB
      -c wal_writer_delay=10ms

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: logsdb

    ports:
      - "5432:5432"

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d logsdb"
        ]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s