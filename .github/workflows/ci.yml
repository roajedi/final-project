name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: logs_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d logs_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build Application
        run: npm run build

      - name: Start Application
        env:
          NODE_ENV: test
          PORT: 8080
          DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/logs_db
          DB_URL: postgres://postgres:postgrespassword@localhost:5432/logs_db
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgrespassword
          DB_NAME: logs_db
          AUTH_ENABLED: false
        run: |
          npx tsx src/server.ts > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for Application
        env:
          DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/logs_db
          DB_URL: postgres://postgres:postgrespassword@localhost:5432/logs_db
        run: npx --yes wait-on http-get://localhost:8080/health --timeout 30000

      - name: Run API Tests
        env:
          BASE_URL: http://localhost:8080
          DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/logs_db
          DB_URL: postgres://postgres:postgrespassword@localhost:5432/logs_db
          AUTH_ENABLED: false
        run: npm test

      - name: Show Server Logs on Failure
        if: failure()
        run: cat server.log